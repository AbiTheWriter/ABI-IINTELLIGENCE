<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abi Intelligence</title>
    <style>
        :root {
            --primary: #ff7675;
            --accent: #fd79a8;
            --bg: #fff5f5;
            --chat-bg: #ffffff;
            --text: #2d3436;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
        }
        .chat-container {
            width: 450px;
            height: 600px;
            background: var(--chat-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 118, 117, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid #ffeaa7;
        }
        .chat-header {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fffdfd;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .bot-msg {
            background: #f1f2f6;
            align-self: flex-start;
            border-top-left-radius: 2px;
            border: 1px solid #e4e7eb;
        }
        .user-msg {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-top-right-radius: 2px;
        }
        .topic-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .btn {
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-1px);
        }
        .form-link-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 10px 15px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 118, 117, 0.2);
            border: 2px solid var(--accent);
            z-index: 10;
        }
        .form-link-container a {
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🌸 Abi Intelligence v1.0</div>
    <div class="chat-box" id="chatBox">
        <div class="message bot-msg">
            Hi! Welcome to Abi Intelligence. Choose a topic below to get started:
            <div class="topic-buttons" id="mainTopics">
                <button class="btn" onclick="selectTopic('animals')">🐾 Animals</button>
                <button class="btn" onclick="selectTopic('colors')">🎨 Colors</button>
                <button class="btn" onclick="selectTopic('bible')">📖 Bible & Jesus</button>
                <button class="btn" onclick="selectTopic('math')">🧮 Math</button>
            </div>
        </div>
    </div>
</div>

<div class="form-link-container">
    <a href="https://forms.gle" target="_blank">❓ Ask a New Question</a>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const botData = {
        animals: {
            text: "Animals are awesome! Which group do you want to learn about?",
            buttons: [{ text: "🐍 Reptiles", action: "reptiles" }, { text: "🦁 Mammals", action: "mammals" }]
        },
        reptiles: {
            text: "<b>Reptiles:</b> Cold-blooded, scale-covered creatures that usually lay eggs. Examples include snakes, lizards, and turtles!",
            buttons: [{ text: "🔄 Back to Main", action: "main" }]
        },
        mammals: {
            text: "<b>Mammals:</b> Warm-blooded animals with hair or fur that give birth to live young. Humans, dogs, and whales are all mammals!",
            buttons: [{ text: "🔄 Back to Main", action: "main" }]
        },
        colors: {
            text: "<b>Colors:</b> Primary colors are Red, Yellow, and Blue. Mixing them creates every other color in art and digital games!",
            buttons: [{ text: "🔄 Back to Main", action: "main" }]
        },
        bible: {
            text: "What would you like to explore about Christianity?",
            buttons: [{ text: "📜 3 Important Verses", action: "verses" }, { text: "🙏 Basics of Christianity", action: "basics" }]
        },
        verses: {
            text: "<b>3 Important Verses:</b><br><br>1. <b>John 3:16</b> - For God so loved the world...<br>2. <b>Philippians 4:13</b> - I can do all things through Christ...<br>3. <b>Genesis 1:1</b> - In the beginning, God created the heavens and the earth.",
            buttons: [{ text: "🔄 Back to Main", action: "main" }]
        },
        basics: {
            text: "<b>Basics of Christianity:</b> It centers on faith in Jesus Christ as the Son of God, following His teachings of love and forgiveness, and studying the Bible.",
            buttons: [{ text: "🔄 Back to Main", action: "main" }]
        },
        math: {
            text: "Math is super helpful for coding games! What level are we working on?",
            buttons: [{ text: "📐 Pre-Algebra", action: "prealgebra" }, { text: "➕ Basic Operations", action: "basicmath" }]
        },
        prealgebra: {
            text: "<b>Pre-Algebra:</b> Introduces variables (like x and y), integers, and basic linear equations. Perfect for practicing game variables!",
            buttons: [{ text: "🔄 Back to Main", action: "main" }]
        },
        basicmath: {
            text: "<b>Basic Number Operations:</b> Addition (+), Subtraction (-), Multiplication (×), and Division (÷). Computer logic completely relies on these rules!",
            buttons: [{ text: "🔄 Back to Main", action: "main" }]
        }
    };

    function selectTopic(topicKey) {
        addMessage(topicKey.toUpperCase(), 'user-msg');
        setTimeout(() => {
            if (topicKey === 'main') { showMainMenu(); return; }
            const data = botData[topicKey];
            if (data) addMessage(data.text, 'bot-msg', data.buttons);
        }, 300);
    }

    function addMessage(text, className, buttons = []) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerHTML = text;
        if (buttons.length > 0) {
            const btnContainer = document.createElement('div');
            btnContainer.className = 'topic-buttons';
            buttons.forEach(btn => {
                const b = document.createElement('button');
                b.className = 'btn';
                b.innerText = btn.text;
                b.onclick = () => selectTopic(btn.action);
                btnContainer.appendChild(b);
            });
            msgDiv.appendChild(btnContainer);
        }
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showMainMenu() {
        addMessage("Choose a topic below to explore:", "bot-msg", [
            { text: "🐾 Animals", action: "animals" }, { text: "🎨 Colors", action: "colors" },
            { text: "📖 Bible & Jesus", action: "bible" }, { text: "🧮 Math", action: "math" }
        ]);
    }
</script>
</body>
</html>
